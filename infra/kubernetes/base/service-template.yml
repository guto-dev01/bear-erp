# Template para deployment de microserviços Bear ERP
# Copiar e ajustar para cada serviço
apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: bear-erp
  labels:
    app: SERVICE_NAME
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: SERVICE_NAME
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: SERVICE_NAME
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "SERVICE_PORT"
    spec:
      containers:
        - name: SERVICE_NAME
          image: bear-erp/SERVICE_NAME:latest
          ports:
            - containerPort: SERVICE_PORT
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: bear-secrets
                  key: mongodb-uri
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
            - name: EUREKA_URI
              value: http://service-discovery:8761/eureka
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bear-secrets
                  key: jwt-secret
            - name: AES_KEY
              valueFrom:
                secretKeyRef:
                  name: bear-secrets
                  key: aes-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: SERVICE_PORT
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: SERVICE_PORT
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: bear-erp
spec:
  selector:
    app: SERVICE_NAME
  ports:
    - port: SERVICE_PORT
      targetPort: SERVICE_PORT
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: SERVICE_NAME-hpa
  namespace: bear-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: SERVICE_NAME
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
