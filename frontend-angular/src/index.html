<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Bear ERP — Sistema Contábil Inteligente</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bear ERP — O sistema contábil SaaS mais avançado do Brasil. IA integrada, multi-tenant, 100% cloud.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08090C" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-152x152.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bear ERP">

  <!-- Open Graph -->
  <meta property="og:title" content="Bear ERP — Sistema Contábil Inteligente">
  <meta property="og:description" content="O sistema contábil SaaS mais avançado do Brasil. IA integrada, multi-tenant, 100% cloud.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">

  <!-- Type: SF Pro is provided by Apple OSes; Inter is the cross-platform fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Material Symbols Rounded (variable) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    /* Critical CSS — prevent FOUC */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
      background: #F2F2F7;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    [data-theme="dark"] body {
      background: #08090C;
      color: #EBEBF0;
    }

    /* Initial loading state — premium spinner */
    bear-root:empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 1.5rem;
    }

    bear-root:empty::before {
      content: '';
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: linear-gradient(135deg, #007AFF, #0A84FF);
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
      animation: logoPulse 1.5s ease-in-out infinite;
    }

    bear-root:empty::after {
      content: '';
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(0, 0, 0, 0.1);
      border-top-color: #007AFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    [data-theme="dark"] bear-root:empty::after {
      border-color: rgba(255, 255, 255, 0.12);
      border-top-color: #0A84FF;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.92); opacity: 0.7; }
    }
  </style>

  <!-- Resolve the theme before first paint: stored preference wins, else follow the
       OS setting. Prevents a flash of the wrong theme (FOUC) on load. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('bear-theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) { /* keep the data-theme default on <html> */ }
    })();
  </script>
</head>
<body class="mat-typography">
  <bear-root></bear-root>
  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;color:#64748b;text-align:center;padding:2rem;">
      <p>O Bear ERP requer JavaScript habilitado para funcionar.</p>
    </div>
  </noscript>
</body>
</html>
