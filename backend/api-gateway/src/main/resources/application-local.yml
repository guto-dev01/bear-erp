spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  cloud:
    gateway:
      default-filters: []
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: empresa-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/empresas/**

        - id: contabilidade-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/contabilidade/**,/api/v1/plano-contas/**,/api/v1/lancamentos/**

        - id: fiscal-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/fiscal/**

        - id: nfe-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/fiscal/nfe/**

        - id: financeiro-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/financeiro/**,/api/v1/contas-pagar/**,/api/v1/contas-receber/**,/api/v1/conciliacao/**

        - id: folha-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/folha/**,/api/v1/funcionarios/**

        - id: esocial-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/v1/esocial/**

        - id: tributario-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/v1/tributario/**,/api/v1/simples/**,/api/v1/lucro-presumido/**,/api/v1/lucro-real/**

        - id: patrimonio-service
          uri: http://localhost:8094
          predicates:
            - Path=/api/v1/patrimonio/**

        - id: escritorio-service
          uri: http://localhost:8095
          predicates:
            - Path=/api/v1/escritorio/**

        - id: certificado-service
          uri: http://localhost:8100
          predicates:
            - Path=/api/v1/certificados/**

        - id: integracoes-service
          uri: http://localhost:8113
          predicates:
            - Path=/api/v1/integracoes/**

        - id: relatorios-service
          uri: http://localhost:8104
          predicates:
            - Path=/api/v1/relatorios/**

        - id: ai-contabil-service
          uri: http://localhost:8105
          predicates:
            - Path=/api/v1/ai-contabil/**

        - id: obrigacoes-service
          uri: http://localhost:8096
          predicates:
            - Path=/api/v1/obrigacoes/**

eureka:
  client:
    enabled: false
