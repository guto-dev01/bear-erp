server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
            key-resolver: "#{@ipKeyResolver}"
      routes:
        # === CORE ===
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: tenant-service
          uri: lb://tenant-service
          predicates:
            - Path=/api/v1/tenants/**

        - id: empresa-service
          uri: lb://empresa-service
          predicates:
            - Path=/api/v1/empresas/**

        # === CADASTROS ===
        - id: clientes-service
          uri: lb://clientes-service
          predicates:
            - Path=/api/v1/clientes/**

        - id: fornecedores-service
          uri: lb://fornecedores-service
          predicates:
            - Path=/api/v1/fornecedores/**

        # === CONTABILIDADE ===
        - id: contabilidade-service
          uri: lb://contabilidade-service
          predicates:
            - Path=/api/v1/contabilidade/**

        - id: plano-contas-service
          uri: lb://plano-contas-service
          predicates:
            - Path=/api/v1/plano-contas/**

        - id: lancamentos-service
          uri: lb://lancamentos-service
          predicates:
            - Path=/api/v1/lancamentos/**

        # === FISCAL ===
        - id: nfe-service
          uri: lb://nfe-service
          predicates:
            - Path=/api/v1/fiscal/nfe/**

        - id: nfse-service
          uri: lb://nfse-service
          predicates:
            - Path=/api/v1/fiscal/nfse/**

        - id: cte-service
          uri: lb://cte-service
          predicates:
            - Path=/api/v1/fiscal/cte/**

        - id: fiscal-service
          uri: lb://fiscal-service
          predicates:
            - Path=/api/v1/fiscal/**

        # === FOLHA ===
        - id: folha-service
          uri: lb://folha-service
          predicates:
            - Path=/api/v1/folha/**

        - id: funcionarios-service
          uri: lb://funcionarios-service
          predicates:
            - Path=/api/v1/funcionarios/**

        - id: esocial-service
          uri: lb://esocial-service
          predicates:
            - Path=/api/v1/esocial/**

        # === FINANCEIRO ===
        - id: financeiro-service
          uri: lb://financeiro-service
          predicates:
            - Path=/api/v1/financeiro/**

        - id: contas-pagar-service
          uri: lb://contas-pagar-service
          predicates:
            - Path=/api/v1/contas-pagar/**

        - id: contas-receber-service
          uri: lb://contas-receber-service
          predicates:
            - Path=/api/v1/contas-receber/**

        - id: conciliacao-service
          uri: lb://conciliacao-service
          predicates:
            - Path=/api/v1/conciliacao/**

        # === TRIBUTARIO ===
        - id: tributario-service
          uri: lb://tributario-service
          predicates:
            - Path=/api/v1/tributario/**

        - id: simples-service
          uri: lb://simples-service
          predicates:
            - Path=/api/v1/simples/**

        - id: lucro-presumido-service
          uri: lb://lucro-presumido-service
          predicates:
            - Path=/api/v1/lucro-presumido/**

        - id: lucro-real-service
          uri: lb://lucro-real-service
          predicates:
            - Path=/api/v1/lucro-real/**

        # === ANALYTICS ===
        - id: relatorios-service
          uri: lb://relatorios-service
          predicates:
            - Path=/api/v1/relatorios/**

        - id: ai-contabil-service
          uri: lb://ai-contabil-service
          predicates:
            - Path=/api/v1/ai-contabil/**

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**

        - id: obrigacoes-service
          uri: lb://obrigacoes-service
          predicates:
            - Path=/api/v1/obrigacoes/**

        # === PATRIMONIO ===
        - id: patrimonio-service
          uri: lb://patrimonio-service
          predicates:
            - Path=/api/v1/patrimonio/**

        # === INTEGRACOES ===
        - id: integracoes-service
          uri: lb://integracoes-service
          predicates:
            - Path=/api/v1/integracoes/**

        # === CERTIFICADO DIGITAL ===
        - id: certificado-service
          uri: lb://certificado-service
          predicates:
            - Path=/api/v1/certificados/**

        # === SPED ===
        - id: sped-service
          uri: lb://sped-service
          predicates:
            - Path=/api/v1/sped/**

        # === GESTAO ESCRITORIO ===
        - id: escritorio-service
          uri: lb://escritorio-service
          predicates:
            - Path=/api/v1/escritorio/**

        # === NOTIFICACOES ===
        - id: notificacao-service
          uri: lb://notificacao-service
          predicates:
            - Path=/api/v1/notificacoes/**

        # === SEFAZ ===
        - id: sefaz-service
          uri: lb://nfe-service
          predicates:
            - Path=/api/v1/fiscal/sefaz/**

        # === DANFE ===
        - id: danfe-service
          uri: lb://nfe-service
          predicates:
            - Path=/api/v1/fiscal/nfe/*/danfe

        # === RELATORIOS CONTABEIS ===
        - id: relatorios-contabilidade
          uri: lb://contabilidade-service
          predicates:
            - Path=/api/v1/contabilidade/relatorios/**

        # === RELATORIOS FOLHA ===
        - id: relatorios-folha
          uri: lb://folha-service
          predicates:
            - Path=/api/v1/folha/relatorios/**

        # === SISTEMA ===
        - id: sistema-auditoria
          uri: lb://tenant-service
          predicates:
            - Path=/api/v1/sistema/auditoria/**

        - id: sistema-tenants
          uri: lb://tenant-service
          predicates:
            - Path=/api/v1/sistema/tenants/**

        # === CADASTROS ===
        - id: cadastros-produtos
          uri: lb://empresa-service
          predicates:
            - Path=/api/v1/cadastros/produtos/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

bear:
  security:
    jwt:
      secret: ${JWT_SECRET:bear-erp-jwt-secret-key-minimum-256-bits-for-hmac-sha256-algorithm}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    br.com.bearerp: DEBUG
