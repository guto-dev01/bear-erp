server:
  port: 8113

spring:
  application:
    name: integracoes-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bear_erp_integracoes}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

bear:
  security:
    jwt:
      secret: ${JWT_SECRET:bear-erp-jwt-secret-key-minimum-256-bits-for-hmac-sha256-algorithm}
    encryption:
      aes-key: ${AES_KEY:YmVhci1lcnAtYWVzMjU2LWtleS0zMmJ5dGVzLW9rISE=}

# Integrações externas. O token do Hub é secreto e só existe aqui (env), nunca no frontend.
integracoes:
  hub:
    cpf-url: ${CPF_API_URL:https://ws.hubdodesenvolvedor.com.br/v2/cpf/}
    cpf-token: ${CPF_API_TOKEN:}
  cnpj:
    url: ${CNPJ_API_URL:https://brasilapi.com.br/api/cnpj/v1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.bearerp: DEBUG
