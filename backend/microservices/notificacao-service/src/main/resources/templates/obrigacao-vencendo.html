<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif;background:#f1f5f9">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#fff">
  <tr><td style="background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:32px;text-align:center">
    <h1 style="color:#fff;margin:0;font-size:24px">Bear ERP</h1>
    <p style="color:#e0e7ff;margin:8px 0 0;font-size:14px">Alerta de Obrigação Acessória</p>
  </td></tr>
  <tr><td style="padding:32px">
    <h2 style="color:#d97706;margin:0 0 16px">Obrigação Próxima do Vencimento</h2>
    <p style="color:#475569;line-height:1.6">Uma obrigação acessória está próxima do prazo de entrega:</p>
    <table style="width:100%;border-collapse:collapse;margin:24px 0">
      <tr><td style="padding:12px;background:#fffbeb;border:1px solid #fed7aa;font-weight:600;color:#374151;width:40%">Obrigação</td>
          <td style="padding:12px;border:1px solid #fed7aa;color:#1e293b" th:text="${obrigacao}"></td></tr>
      <tr><td style="padding:12px;background:#fffbeb;border:1px solid #fed7aa;font-weight:600;color:#374151">Vencimento</td>
          <td style="padding:12px;border:1px solid #fed7aa;color:#d97706;font-weight:600" th:text="${vencimento}"></td></tr>
    </table>
    <p style="color:#64748b;font-size:13px">Providencie a transmissão dentro do prazo para evitar multas.</p>
  </td></tr>
  <tr><td style="background:#f8fafc;padding:24px;text-align:center;border-top:1px solid #e2e8f0">
    <p style="color:#94a3b8;font-size:12px;margin:0">Bear ERP - Sistema de Gestão Contábil</p>
  </td></tr>
</table>
</body></html>
