    environment:
      <<: *service-env
      MONGODB_URI: mongodb://${MONGO_USER:-bearadmin}:${MONGO_PASSWORD:-BearErp2024!}@mongodb:27017/bear_erp_certificado?authSource=admin
    depends_on: *service-deps
    networks:
      - bear-network

  integracoes-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: integracoes-service
    image: bear-erp/integracoes-service:latest
    container_name: bear-integracoes-service
    restart: unless-stopped
    ports:
      - "8113:8113"
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://${MONGO_USER:-bearadmin}:${MONGO_PASSWORD:-BearErp2024!}@mongodb:27017/bear_erp_integracoes?authSource=admin
    depends_on: *service-deps
    networks:
      - bear-network

  # ==================== FRONTEND ====================

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    image: bear-erp/frontend:latest
    container_name: bear-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - bear-network

  # ==================== MONITORING ====================

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: bear-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - bear-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: bear-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-BearGrafana2024!}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bear-network

volumes:
  mongodb_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  bear-network:
    driver: bridge
    name: bear-erp-network
