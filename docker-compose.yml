services:
  # ==================== INFRASTRUCTURE ====================

  mongodb:
    image: mongo:7.0
    container_name: bear-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-bearadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-BearErp2024!}
    volumes:
      - mongodb_data:/data/db
    networks:
      - bear-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: bear-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - bear-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: bear-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - bear-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bear-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bear-network

  # ==================== SERVICE DISCOVERY ====================

  service-discovery:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.discovery
    image: bear-erp/service-discovery:latest
    container_name: bear-service-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - bear-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ==================== API GATEWAY ====================

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gateway
    image: bear-erp/api-gateway:latest
    container_name: bear-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://service-discovery:8761/eureka
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-bear-erp-jwt-secret-key-minimum-256-bits-for-hmac-sha256-algorithm}
    depends_on:
      service-discovery:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bear-network

  # ==================== CORE SERVICES ====================

  auth-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    image: bear-erp/auth-service:latest
    container_name: bear-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment: &service-env
      MONGODB_URI: mongodb://${MONGO_USER:-bearadmin}:${MONGO_PASSWORD:-BearErp2024!}@mongodb:27017/bear_erp_auth?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URI: http://service-discovery:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-bear-erp-jwt-secret-key-minimum-256-bits-for-hmac-sha256-algorithm}
      AES_KEY: ${AES_KEY:-YmVhci1lcnAtYWVzMjU2LWtleS0zMmJ5dGVzLW9rISE=}
    depends_on: &service-deps
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      service-discovery:
        condition: service_healthy
    networks:
      - bear-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

